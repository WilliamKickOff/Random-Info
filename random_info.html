<div class="diagram-container">
    <!-- Líneas de conexión (SVG) -->
    <svg class="svg-lines">
    </svg>

    <!-- Cajas -->
    <div class="node billing">Higher Rankings – Appear at the top of Google & beyond</div>
    <div class="node invoicing">More Traffic – Drive qualified visitors to your website</div>
    <div class="node tax">Stronger Authority – Build trust and credibility in your industry</div>
    <div class="node radar">High-quality, engaging content</div>
    <div class="node payments">Enhanced user experience</div>
    <div class="node security">Adaptation to ever-evolving algorithms</div>
</div>

<!-- Estilos -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');

  .diagram-container {
      position: relative;
      width: 600px;
      height: 750px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
  }

  /* Líneas de conexión en ángulos rectos */
  .svg-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      filter: drop-shadow(2px 2px 5px rgba(142, 45, 226, 0.3));
  }

  /* Líneas animadas en morado con sombra */
  .connector {
      stroke: #8E2DE2;
      stroke-width: 1px;
      stroke-linecap: butt;
      stroke-dasharray: none;
      transition: stroke 0.5s ease-in-out;
      animation: dashAnim 2.5s ease-in-out infinite;
  }

  @keyframes dashAnim {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
  }

  /* Cajas */
  .node {
      position: absolute;
      width: 200px;
      height: 120px;
      background: #bdbdbd;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: white;
      text-align: center;
      padding: 10px;
      transition: background 0.8s ease-in-out, transform 0.6s ease-in-out, box-shadow 0.6s ease-in-out;
      z-index: 1;
  }

  /* Estado activo con brillo */
  .node.active {
      background: linear-gradient(45deg, #FF007F, #8E2DE2);
      box-shadow: 0px 0px 15px rgba(255, 0, 127, 0.6);
      transform: scale(1.05);
  }

  /* Efecto Hover */
  .node:hover {
      transform: scale(1.1);
      box-shadow: 0px 0px 20px rgba(142, 45, 226, 0.6);
  }

  /* Posiciones de las cajas separadas verticalmente */
  .billing { top: 30px; left: 100px; }
  .invoicing { top: 180px; left: 300px; }
  .tax { top: 280px; left: 50px; }
  .radar { top: 380px; left: 350px; }
  .payments { top: 500px; left: 150px; }
  .security { top: 650px; left: 300px; }
</style>

<!-- Animaciones con GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  function generateRandomConnections() {
      const svg = document.querySelector(".svg-lines");
      svg.innerHTML = "";
      const nodes = Array.from(document.querySelectorAll(".node"));
      nodes.forEach(node => node.classList.remove("active"));
      
      let activeNodes = [];

      while (activeNodes.length < 3) {
          let randomNode = nodes[Math.floor(Math.random() * nodes.length)];
          if (!activeNodes.includes(randomNode)) {
              activeNodes.push(randomNode);
              randomNode.classList.add("active");
          }
      }

      for (let i = 0; i < activeNodes.length - 1; i++) {
          let from = activeNodes[i];
          let to = activeNodes[i + 1];

          let line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
          line.setAttribute("class", "connector");
          line.setAttribute("fill", "none");
          line.setAttribute("stroke", "#8E2DE2");
          line.setAttribute("stroke-width", "1px");
          line.setAttribute("points", `${from.offsetLeft + 100},${from.offsetTop + 40} ${from.offsetLeft + 100},${to.offsetTop + 40} ${to.offsetLeft + 100},${to.offsetTop + 40}`);
          svg.appendChild(line);
      }
  }

  function cycleConnections() {
      setInterval(generateRandomConnections, 3000);
  }

  generateRandomConnections();
  cycleConnections();
</script>
